name: 'Trend Personal — Event'
description: 'Adds the event content type: something happening at a particular place and time, with a Smart Date range and an optional link to a Place. Includes a calendar view. Requires the trend_personal base; apply trend_place first if you want the place reference.'
type: 'Content type'

# Apply the trend_personal base recipe first, then trend_place, then this.
install:
  - smart_date
  - smart_date_starter_kit
  - fullcalendar_view

config:
  strict: false
  actions:
    workflows.workflow.editorial:
      addNodeTypes:
        - event
